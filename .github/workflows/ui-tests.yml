name: UI Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout test project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ui.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Clone GAD
        run: |
          git clone https://github.com/jaktestowac/gad-gui-api-demo.git /tmp/gad

      - name: Install GAD dependencies
        working-directory: /tmp/gad
        run: npm install

      - name: Start GAD
        working-directory: /tmp/gad
        run: |
          npm run start > /tmp/gad.log 2>&1 &

      - name: Wait for GAD
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "GAD is ready"
              exit 0
            fi

            echo "Waiting for GAD..."
            sleep 2
          done

          echo "GAD failed to start"
          cat /tmp/gad.log
          exit 1

      - name: Run UI tests
        run: |
          pytest automation/ui --browser chromium